[mod]
id = "mod_menu"
version = "0.3.5"
priority = 100

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The Mods screen's logic (layout, search, filter, wrapping): no game types, so it has its own tests.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "native_mod_menu"
source = "runtime.rs"

# The Mods screen itself: drawing, mouse, wheel and keys.
[[module]]
id = "ui"
file = "crates/horizon-client/src/game.rs"
name = "native_mod_menu_ui"
source = "ui.rs"

# What the title screen's button shares with the screen (the client library, which the game uses).
[[module]]
id = "title"
file = "crates/horizon-client/src/title.rs"
name = "native_mod_menu_title"
source = "title_runtime.rs"
visibility = "pub"

# DirectX 12 (FXC): Horizon's terrain shader made ready for FXC; the game crashed at its start there.
[[module]]
id = "fxc_runtime"
file = "crates/horizon-client-render/src/lib.rs"
name = "native_mod_menu_fxc"
source = "fxc_runtime.rs"
visibility = "pub"

[[injection]]
id = "fxc"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::gfx::reuse::On<'_>::create_shader_module"
helper = "fxc.rs"
bindings = [
  { name = "this", ty = "&On<'_>", value = "self" },
  { name = "descriptor", ty = "&wgpu::ShaderModuleDescriptor<'_>", value = "&descriptor" },
]

[[injection]]
id = "listed"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "listed.rs"
bindings = [{ name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" }]

# Once a frame: a stale "Mods screen is open" flag is cleared when the Options screen is gone.
[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# The title screen: a fourth icon button after Accessibility, its icon and tooltip, its press.
[[injection]]
id = "title-buttons"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::title::Title::buttons"
helper = "title_buttons.rs"
bindings = [
  { name = "title", ty = "&Title", value = "self" },
  { name = "w", ty = "f32", value = "w" },
  { name = "h", ty = "f32", value = "h" },
]

[[injection]]
id = "title-click"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::title::Title::click"
helper = "title_click.rs"
bindings = [
  { name = "title", ty = "&mut Title", value = "&mut *self" },
  { name = "x", ty = "f32", value = "x" },
  { name = "y", ty = "f32", value = "y" },
  { name = "size", ty = "(f32, f32)", value = "size" },
]

[[injection]]
id = "title-draw"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::title::Title::draw_with_items"
helper = "title_draw.rs"
bindings = [
  { name = "title", ty = "&Title", value = "self" },
  { name = "atlas", ty = "&HudAtlas", value = "atlas" },
  { name = "items", ty = "Option<&crate::item_render::ItemRenderer>", value = "items" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
  { name = "cursor", ty = "(f32, f32)", value = "cursor" },
  { name = "hide_splash", ty = "bool", value = "hide_splash" },
  { name = "hide_server_address", ty = "bool", value = "hide_server_address" },
]

# The Options screen's draw and input, taken over while the Mods screen is open.
[[injection]]
id = "options-draw"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::options::Game<'_>::draw_options"
helper = "options_draw.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "options-mouse"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::options::Game<'_>::options_mouse"
helper = "options_mouse.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pressed", ty = "bool", value = "pressed" },
  { name = "right", ty = "bool", value = "right" },
]

[[injection]]
id = "options-drag"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::options::Game<'_>::options_drag"
helper = "options_drag.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "options-scroll"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::options::Game<'_>::options_scroll"
helper = "options_scroll.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "amount", ty = "f32", value = "amount" },
]

[[injection]]
id = "options-key"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::options::Game<'_>::options_key"
helper = "options_key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "KeyCode", value = "key" },
  { name = "text", ty = "Option<&str>", value = "text" },
]

[[injection]]
id = "options-shortcut"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::options::Game<'_>::options_shortcut"
helper = "options_shortcut.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "shortcut", ty = "horizon_client::clipboard::EditShortcut", value = "shortcut" },
]
